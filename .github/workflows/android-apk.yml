name: Build YOUSIVAR Release APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.js'
      - 'capacitor.config.ts'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build web application
        run: npm run build

      - name: Initialize Android project
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Configure release signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -eu
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yousivar-release.jks"
          test -s "$RUNNER_TEMP/yousivar-release.jks"

          {
            printf 'storeFile=%s\n' "$RUNNER_TEMP/yousivar-release.jks"
            printf 'storePassword=%s\n' "$ANDROID_KEYSTORE_PASSWORD"
            printf 'keyAlias=%s\n' "$ANDROID_KEY_ALIAS"
            printf 'keyPassword=%s\n' "$ANDROID_KEY_PASSWORD"
          } > "$RUNNER_TEMP/keystore.properties"

          echo "KEYSTORE_PROPERTIES=$RUNNER_TEMP/keystore.properties" >> "$GITHUB_ENV"

      - name: Patch Gradle signing configuration
        working-directory: android
        env:
          KEYSTORE_PROPERTIES: ${{ runner.temp }}/keystore.properties
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle")
          if not p.is_file():
              raise SystemExit(
                  "Expected app/build.gradle (Groovy). "
                  "No Gradle file was changed."
              )

          text = p.read_text()

          # Repair the literal backslash-n introduced by the previous workflow.
          text = text.replace(r'\n', '\n')

          if "signingConfigs {" not in text:
              signing = """
              signingConfigs {
                  release {
                      def props = new Properties()
                      def propsFile = System.getenv("KEYSTORE_PROPERTIES")
                      file(propsFile).withInputStream { props.load(it) }
                      storeFile file(props['storeFile'])
                      storePassword props['storePassword']
                      keyAlias props['keyAlias']
                      keyPassword props['keyPassword']
                  }
              }
          """
              text, count = re.subn(
                  r'android\s*\{',
                  lambda m: m.group(0) + signing,
                  text,
                  count=1
              )
              if count != 1:
                  raise SystemExit("Could not find the android block")

          # Remove any malformed release block inserted by the old workflow.
          text = re.sub(
              r'buildTypes\s*\{\s*release\s*\{\s*signingConfig\s+signingConfigs\.release\s*\}',
              'buildTypes {',
              text,
              count=1
          )

          # Add signingConfig to the existing release block, or create one.
          if re.search(r'buildTypes\s*\{', text) is None:
              raise SystemExit("Could not find the buildTypes block")

          match = re.search(r'buildTypes\s*\{', text)
          tail = text[match.end():]

          release = re.search(r'\brelease\s*\{', tail)
          if release:
              pos = match.end() + release.end()
              text = (
                  text[:pos]
                  + "\n            signingConfig signingConfigs.release\n"
                  + text[pos:]
              )
          else:
              pos = match.end()
              text = (
                  text[:pos]
                  + "\n        release {\n"
                    "            signingConfig signingConfigs.release\n"
                    "        }\n"
                  + text[pos:]
              )

          if r'\n' in text:
              raise SystemExit("Unexpected literal \\\\n remains in Gradle file")

          p.write_text(text)
          print("Gradle release signing configuration repaired.")
          PY

      - name: Build signed Release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yousivar-omega-release-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish APK to GitHub Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eu
          APK="$(find android/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          test -s "$APK"
          TAG="v1.0.${GITHUB_RUN_NUMBER}-build${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "$APK#YOUSIVAR-OMEGA.apk" \
            --title "YOUSIVAR–Ω $TAG" \
            --notes "YOUSIVAR–Ω Android Release.

          Signed release APK for direct download.

          Build: ${GITHUB_RUN_NUMBER}
          Commit: ${GITHUB_SHA}" \
            --latest
