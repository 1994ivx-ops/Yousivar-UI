name: Repair npm lockfile

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Regenerate lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Confirm lockfile dependencies
        run: |
          node -e "const l=require('./package-lock.json'); for(const p of ['node_modules/chokidar','node_modules/readdirp']) console.log(p, l.packages?.[p]?.version || 'not found')"

      - name: Commit corrected lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile unchanged."
          else
            git commit -m "fix: regenerate npm lockfile in Ubuntu"
            git push origin HEAD:main
          fi
